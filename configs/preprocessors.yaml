# Закрепление препроцессоров за моделями
model_preprocessors:
  catboost: booster
  xgboost: booster
  lightgbm: booster
  random_forest: booster
  logreg: scaled_onehot

# Параметры препроцессоров по умолчанию
preprocessors:
  booster:
    missing_value: "отсутствует"
  onehot:
    missing_value: "отсутствует"
  scaled_onehot:
    missing_value: "отсутствует"
    scale_ordinal_features: true
