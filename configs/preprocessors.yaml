# =============================================================================
# Конфигурация предобработки данных (Preprocessors Configuration)
# =============================================================================

# 1. Привязка препроцессоров по умолчанию к моделям
model_preprocessors:
  catboost: booster
  xgboost: booster
  lightgbm: booster
  random_forest: booster
  logreg: scaled_onehot

# 2. Параметры препроцессоров по умолчанию
preprocessors:
  # Препроцессор для моделей градиентного бустинга и деревьев решений (сохраняет категории)
  booster:
    missing_value: "отсутствует"  # Заполнитель для пропущенных строковых значений

  # Препроцессор с One-Hot кодированием категорий без масштабирования числовых признаков
  onehot:
    missing_value: "отсутствует"  # Заполнитель для пропущенных значений
    scale_numeric: false          # Отключить масштабирование числовых колонок
    scale_ordinal_features: false # Отключить масштабирование порядковых колонок

  # Препроцессор с One-Hot кодированием и StandardScaler (для линейных моделей)
  scaled_onehot:
    missing_value: "отсутствует"  # Заполнитель для пропущенных значений
    scale_numeric: true           # Масштабировать числовые колонки (StandardScaler)
    scale_ordinal_features: true  # Масштабировать порядковые колонки (StandardScaler)
