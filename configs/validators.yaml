# Валидатор по умолчанию
default: stratified_kfold

# Конфигурация валидаторов
stratified_kfold:
  n_splits: 5
  shuffle: true
  random_state: 42

kfold:
  n_splits: 5
  shuffle: true
  random_state: 42

stratified_shuffle_split:
  n_splits: 5
  test_size: 0.2
  random_state: 42

shuffle_split:
  n_splits: 5
  test_size: 0.2
  random_state: 42

train_test_split:
  test_size: 0.2
  shuffle: true
  random_state: 42

