# =============================================================================
# Конфигурация валидаторов данных (Cross-Validation Configuration)
# =============================================================================
# Валидатор по умолчанию, используемый при отсутствии явного указания
default: stratified_kfold

# Стратифицированная K-Fold кросс-валидация со сбалансированным распределением классов
stratified_kfold:
  n_splits: 5         # Количество фолдов разбиения
  shuffle: true       # Перемешивание выборки перед разбиением
  random_state: 42    # Сид генератора случайных чисел для воспроизводимости

# Стандартная K-Fold кросс-валидация
kfold:
  n_splits: 5         # Количество фолдов разбиения
  shuffle: true       # Перемешивание выборки перед разбиением
  random_state: 42    # Сид генератора случайных чисел для воспроизводимости

# Стратифицированное случайное разбиение (Monte Carlo Cross-Validation)
stratified_shuffle_split:
  n_splits: 5         # Количество итераций повторного разбиения
  test_size: 0.2      # Доля тестовой выборки в каждом разбиении
  random_state: 42    # Сид генератора случайных чисел

# Случайное разбиение выборки (без сохранения баланса классов)
shuffle_split:
  n_splits: 5         # Количество итераций разбиения
  test_size: 0.2      # Доля тестовой выборки в каждом разбиении
  random_state: 42    # Сид генератора случайных чисел

# Валидация временных рядов (с последовательным расширением обучающего окна)
time_series_split:
  n_splits: 5         # Количество последовательных сплитов

# Однократное разбиение на train и test
train_test_split:
  test_size: 0.2      # Доля тестовой выборки
  shuffle: true       # Перемешивать ли данные перед разбиением
  random_state: 42    # Сид генератора случайных чисел
