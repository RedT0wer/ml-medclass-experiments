# =============================================================================
# Конфигурация параметров моделей по умолчанию (Default Model Hyperparameters)
# =============================================================================
# Все параметры инициализации моделей задаются исключительно в данном файле.
# Переопределение возможно через аргументы командной строки или вызовы API.

# -----------------------------------------------------------------------------
# CatBoost (CatBoostClassifier)
# Градиентный бустинг над решающими деревьями от Яндекса
# -----------------------------------------------------------------------------
catboost:
  # Количество итераций (решающих деревьев) в ансамбле
  iterations: 200

  # Максимальная глубина каждого решающего дерева
  depth: 5

  # Скорость обучения (learning rate / шаг градиентного спуска)
  learning_rate: 0.05

  # Зерно генератора случайных чисел для воспроизводимости обучения
  random_seed: 42

  # Режим логирования хода обучения (0 — подавить вывод)
  verbose: 0

  # Количество рабочих потоков CPU (-1 — использовать все доступные ядра)
  thread_count: -1


# -----------------------------------------------------------------------------
# XGBoost (XGBClassifier)
# Экстремальный градиентный бустинг (Extreme Gradient Boosting)
# -----------------------------------------------------------------------------
xgboost:
  # Количество базовых решающих деревьев в ансамбле
  n_estimators: 100

  # Максимальная глубина каждого дерева (контроль сложности и регуляризации)
  max_depth: 5

  # Скорость обучения (коэффициент сжатия шага градиентного спуска)
  learning_rate: 0.1

  # Зерно генератора случайных чисел для детерминированности обучения
  random_state: 42

  # Функция оценки потерь для многоклассовой классификации (multiclass logloss)
  eval_metric: "mlogloss"

  # Количество параллельных вычислительных потоков (-1 — задействовать все ядра CPU)
  n_jobs: -1


# -----------------------------------------------------------------------------
# LightGBM (LGBMClassifier)
# Быстрый градиентный бустинг на деревьях решений на основе гистограммных алгоритмов
# -----------------------------------------------------------------------------
lightgbm:
  # Количество итераций бустинга (деревьев в ансамбле)
  n_estimators: 100

  # Зерно генератора случайных чисел для воспроизводимости
  random_state: 42

  # Уровень детализации логов (-1 — подавлять информационные сообщения)
  verbose: -1

  # Количество параллельных потоков процессора (-1 — использовать все доступные ядра)
  n_jobs: -1


# -----------------------------------------------------------------------------
# Logistic Regression (LogisticRegression)
# Линейная модель логистической регрессии для задач многоклассовой классификации
# -----------------------------------------------------------------------------
logreg:
  # Обратная величина коэффициента регуляризации (L2). Меньшие значения усиливают штраф
  C: 1.0

  # Максимальное количество итераций оптимизатора до достижения сходимости
  max_iter: 1000

  # Зерно генератора случайных чисел для воспроизводимости сходимости
  random_state: 42


# -----------------------------------------------------------------------------
# Random Forest (RandomForestClassifier)
# Ансамбль независимых решающих деревьев с бэггингом и случайными признаками
# -----------------------------------------------------------------------------
random_forest:
  # Количество решающих деревьев в лесу
  n_estimators: 100

  # Зерно генератора случайных чисел для воспроизводимости
  random_state: 42

  # Количество параллельных процессов для обучения и предсказания (-1 — все ядра)
  n_jobs: -1
